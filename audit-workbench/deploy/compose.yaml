services:
  audit-workbench:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: audit-workbench-static:local
    restart: unless-stopped
    environment:
      AUDIT_DOMAIN: "${AUDIT_DOMAIN:?Set_AUDIT_DOMAIN_in_.env}"
      ACME_EMAIL: "${ACME_EMAIL:?Set_ACME_EMAIL_in_.env}"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: '10001:10001'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  caddy_data:
  caddy_config:
