<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Audit Workbench · Auditoría offline</title>
  <meta name="theme-color" content="#102a3b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src https:; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; manifest-src 'self'; worker-src 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/dragon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="team.css">
  <link rel="stylesheet" href="contrast.css">
  <link rel="stylesheet" href="relations.css">
  <link rel="stylesheet" href="templates.css">
  <link rel="stylesheet" href="fonts/atkinson.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Navegación del expediente">
      <div class="brand"><div class="brand-mark"><img src="icons/dragon.svg" width="39" height="39" alt="Dragón, icono de Audit Workbench"></div><div><strong>Audit Workbench</strong><small>SYSADMIN / SECURITY</small></div></div>
      <div class="side-caption" id="workspace-label">MENÚ PRINCIPAL</div>
      <nav id="global-navigation" aria-label="Menú principal"><button type="button" data-go="records"><span class="nav-mark">▤</span> Biblioteca de auditorías</button><button type="button" data-go="backups"><span class="nav-mark">▣</span> Copias y exportaciones</button><button type="button" data-go="settings"><span class="nav-mark">⚙</span> Configuración</button><button type="button" data-go="connections"><span class="nav-mark">↗</span> Conexiones online</button></nav>
      <div class="audit-context" id="audit-context" hidden><span class="context-kicker">EXPEDIENTE ACTUAL</span><strong id="audit-context-title"></strong><small id="audit-context-ref"></small><button class="button quiet small" type="button" data-go="records">Cambiar auditoría ↗</button></div>
      <nav id="navigation" aria-label="Secciones del expediente"></nav>
      <div class="side-bottom"><span class="dot"></span> Entorno local · Offline <small>Sin servicios externos ni telemetría</small></div>
    </aside>
    <div class="content-wrap">
      <header class="topbar">
        <div class="breadcrumb"><span id="active-audit-label">Biblioteca</span><b>/</b><strong id="current-section">Vista general</strong></div>
        <span id="main-audit-context" class="main-audit-context" hidden></span>
        <div class="actions">
          <label class="theme-select" for="palette">Paleta
            <select id="palette" aria-label="Paleta de color">
              <option value="ocean">Océano</option>
              <option value="forest">Bosque</option>
              <option value="indigo">Índigo</option>
              <option value="graphite">Grafito</option>
              <option value="midnight">Medianoche (oscuro)</option>
              <option value="obsidian">Obsidiana (oscuro)</option>
              <option value="pine-dark">Pino (oscuro)</option>
              <option value="amethyst-dark">Amatista (oscuro)</option>
              <option value="crimson-dark">Granate (oscuro)</option>
            </select>
          </label>
          <button type="button" id="open-library" class="button quiet">Mis auditorías</button>
          <span id="pdf-theme" hidden></span><span class="save-status" id="save-status" role="status">Preparando expediente</span>
          <button type="button" id="btn-import" class="button quiet">Importar</button>
          <button type="button" id="btn-export" class="button quiet">Guardar JSON</button>
          <button type="button" id="btn-pdf" class="button accent">Generar PDF ↗</button>
          <input type="file" id="input-import" accept=".json,application/json" hidden>
        </div>
      </header>
      <main id="workspace" tabindex="-1"></main>
      <footer class="app-footer">Audit Workbench · Los resultados deben ser revisados por el auditor · <span id="local-date"></span></footer>
    </div>
  </div>
  <article id="report" aria-label="Informe final de auditoría"></article>
  <script src="exporters.js" defer></script>
  <script src="hardware-catalog.js" defer></script>
  <script src="audit-relations.js" defer></script>
  <script src="control-templates.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
