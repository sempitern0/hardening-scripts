<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Audit Workbench · Auditoría offline</title>
  <meta name="theme-color" content="#102a3b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; manifest-src 'self'; worker-src 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/dragon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/team.css">
  <link rel="stylesheet" href="css/contrast.css">
  <link rel="stylesheet" href="css/relations.css">
  <link rel="stylesheet" href="css/templates.css">
  <link rel="stylesheet" href="css/atkinson.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="stylesheet" href="css/quality.css">
  <link rel="stylesheet" href="css/retest.css">
  <link rel="stylesheet" href="css/comparison.css">
  <link rel="stylesheet" href="css/glossary.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Navegación del expediente">
      <div class="brand"><div class="brand-mark"><img src="icons/dragon.svg" width="39" height="39" alt="Dragón, icono de Audit Workbench"></div><div><strong>Audit Workbench</strong><small>SYSADMIN / SECURITY</small></div></div>
      <div class="side-caption" id="workspace-label">MENÚ PRINCIPAL</div>
      <nav id="global-navigation" aria-label="Menú principal">
        <button type="button" data-go="records"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Biblioteca de auditorías</span></button>
        <button type="button" data-go="backups"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16v13H4zM7 4h10v3M12 11v6m-3-3 3 3 3-3"/></svg><span>Copias y exportaciones</span></button>
        <button type="button" data-go="settings"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l-2 2a1.7 1.7 0 0 0-1.9-.3l-1.1.5H9.3l-1.1-.5a1.7 1.7 0 0 0-1.9.3l-2-2a1.7 1.7 0 0 0 .3-1.9l-.5-1.1V10l.5-1.1a1.7 1.7 0 0 0-.3-1.9l2-2a1.7 1.7 0 0 0 1.9.3l1.1-.5h5.4l1.1.5a1.7 1.7 0 0 0 1.9-.3l2 2a1.7 1.7 0 0 0-.3 1.9l.5 1.1v3.9z"/></svg><span>Configuración</span></button>
        <button type="button" data-go="connections"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 14 21 3M14 3h7v7M20 14v6H4V4h6"/></svg><span>Conexiones online</span></button>
        <button type="button" data-go="glossary"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></svg><span>Diccionario técnico</span></button>
      </nav>
      <div class="audit-context" id="audit-context" hidden><span class="context-kicker">EXPEDIENTE ACTUAL</span><strong id="audit-context-title"></strong><small id="audit-context-ref"></small><button class="button quiet small" type="button" data-go="records">Cambiar auditoría ↗</button></div>
      <nav id="navigation" aria-label="Secciones del expediente"></nav>
      <div class="side-bottom network-panel" id="network-panel" data-state="unknown" aria-label="Estado de conectividad">
        <div class="network-head">
          <span class="network-symbol" aria-hidden="true">
            <svg class="network-glyph network-glyph-online" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a14 14 0 0 1 18 0M6 12.5a9 9 0 0 1 12 0M9.5 16a4 4 0 0 1 5 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>
            <svg class="network-glyph network-glyph-offline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 18 18M3.2 9.3c3.1-2.5 7-3.5 10.7-2.9M19 7.8c.8.4 1.5.9 2 1.4M6 12.5c1.1-.8 2.2-1.4 3.5-1.7M16.8 12a9 9 0 0 1 1.2.5M9.5 16a4 4 0 0 1 4.4-.3"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>
            <svg class="network-glyph network-glyph-reachable" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.8 3 5.2-6"/></svg>
            <svg class="network-glyph network-glyph-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>
          </span>
          <div class="network-copy">
            <strong id="network-status" role="status" aria-live="polite">Estado de red sin comprobar</strong>
            <small id="network-description">La aplicación funciona offline.</small>
          </div>
        </div>
        <button type="button" class="network-check" id="network-check" title="Comprobar solo acceso al servidor de la aplicación, sin enviar datos de la auditoría" aria-label="Comprobar conexión al servidor de la aplicación">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.9 9a7 7 0 0 1 12-2L20 12M4 12l2.1 3a7 7 0 0 0 12-1"/></svg>
          <span>Comprobar servidor</span>
        </button>
      </div>
    </aside>
    <div class="content-wrap">
      <header class="topbar">
        <div class="breadcrumb"><span id="active-audit-label">Biblioteca</span><b>/</b><strong id="current-section">Vista general</strong></div>
        <span id="main-audit-context" class="main-audit-context" hidden></span>
        <div class="actions">
          <label class="theme-select" for="palette">Paleta
            <select id="palette" aria-label="Paleta de color">
              <option value="ocean">Océano</option>
              <option value="forest">Bosque</option>
              <option value="indigo">Índigo</option>
              <option value="graphite">Grafito</option>
              <option value="midnight">Medianoche (oscuro)</option>
              <option value="obsidian">Obsidiana (oscuro)</option>
              <option value="pine-dark">Pino (oscuro)</option>
              <option value="amethyst-dark">Amatista (oscuro)</option>
              <option value="crimson-dark">Granate (oscuro)</option>
            </select>
          </label>
          <button type="button" id="open-library" class="button quiet">Mis auditorías</button>
          <span id="pdf-theme" hidden></span><span class="save-status" id="save-status" role="status">Preparando expediente</span>
          <button type="button" id="btn-import" class="button quiet">Importar</button>
          <button type="button" id="btn-export" class="button quiet">Guardar JSON</button>
          <button type="button" id="btn-pdf" class="button accent">Generar PDF ↗</button>
          <input type="file" id="input-import" accept=".json,application/json" hidden>
        </div>
      </header>
      <main id="workspace" tabindex="-1"></main>
      <footer class="app-footer">Audit Workbench · Los resultados deben ser revisados por el auditor · <span id="local-date"></span></footer>
    </div>
  </div>
  <article id="report" aria-label="Informe final de auditoría"></article>
  <script src="js/exporters.js" defer></script>
  <script src="js/hardware-catalog.js" defer></script>
  <script src="js/os-catalog.js" defer></script>
  <script src="js/glossary.js" defer></script>
  <script src="js/audit-relations.js" defer></script>
  <script src="js/control-templates.js" defer></script>
  <script src="js/audit-quality.js" defer></script>
  <script src="js/audit-retest.js" defer></script>
  <script src="js/audit-comparison.js" defer></script>
  <script src="js/audit-storage.js" defer></script>
  <script src="js/inventory-import.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
