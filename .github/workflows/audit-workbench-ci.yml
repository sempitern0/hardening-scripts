name: Audit Workbench checks
on:
  push:
    paths:
      - 'audit-workbench/**'
      - '.github/workflows/audit-workbench-ci.yml'
  pull_request:
    paths:
      - 'audit-workbench/**'
      - '.github/workflows/audit-workbench-ci.yml'
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in audit-workbench/js/*.js audit-workbench/sw.js; do node --check "$file"; done
      - name: Run offline unit tests
        shell: bash
        run: |
          set -euo pipefail
          for file in audit-workbench/tests/*.cjs; do node "$file"; done
      - name: Run isolated discovery engine regression tests
        run: python3 -m unittest discover -s audit-workbench/tests -p test_discovery.py -v
      - name: Test interactive discovery assistant (offline)
        run: python3 -m unittest discover -s audit-workbench/tests -p test_discovery_wizard.py -v
      - name: Check Bash discovery launchers
        run: bash -n audit-workbench/discovery/run.sh audit-workbench/discovery/setup.sh
      - name: Check HTTPS static deployment contract
        run: node audit-workbench/tests/test_https_deploy.cjs
      - name: Check HTTPS smoke-test Python syntax
        run: python3 -m py_compile audit-workbench/deploy/smoke_https.py
      - name: Check Bash launcher syntax
        run: bash -n audit-workbench/audit-workbench.sh
      - name: Verify installable resource references
        run: node audit-workbench/tests/test_shell_resources.cjs
